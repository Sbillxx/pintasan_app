<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generator Tulisan Tangan Folio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat&family=Homemade+Apple&family=Reenie+Beanie&family=Nanum+Pen+Script&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        background: #eee;
        color: #222;
      }
      .panel {
        max-width: 700px;
        margin: auto;
        display: grid;
        gap: 8px;
      }
      textarea {
        width: 100%;
        height: 160px;
        box-sizing: border-box;
        padding: 8px;
        font-size: 15px;
      }
      label {
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      input[type="range"] {
        flex: 1;
      }
      button,
      select {
        padding: 10px;
        font-size: 15px;
      }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 12px auto;
        box-shadow: 0 2px 8px #0004;
        background: #fff;
      }
      small {
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <textarea id="text">
Nama : Budi Santoso
NIM : 123456789

Pada hari ini saya mengerjakan tugas menulis tangan menggunakan generator buatan sendiri. Hasilnya dibuat agar mirip tulisan tangan asli dan mengikuti garis kertas folio.</textarea
      >
      <label
        >Font
        <select id="font">
          <option value="Caveat">Caveat</option>
          <option value="Homemade Apple">Homemade Apple</option>
          <option value="Reenie Beanie">Reenie Beanie</option>
          <option value="Nanum Pen Script">Nanum Pen Script</option>
          <option value="custom">Font sendiri (upload .ttf)</option>
        </select>
      </label>
      <label
        >Upload font tulisan tangan
        <input type="file" id="fontfile" accept=".ttf,.otf,.woff,.woff2"
      /></label>
      <label
        >Ganti foto kertas <input type="file" id="paperfile" accept="image/*"
      /></label>
      <small
        >Foto kertas sebaiknya di-crop pas satu lembar, lurus, dan garisnya
        horizontal. Garis dideteksi otomatis.</small
      >
      <label
        >Mulai dari garis ke-
        <input type="range" id="start" min="0" max="8" value="2" /><span
          id="startv"
          >2</span
        ></label
      >
      <label
        >Ukuran huruf
        <input type="range" id="size" min="60" max="180" value="100"
      /></label>
      <label
        >Margin kiri <input type="range" id="left" min="2" max="20" value="7"
      /></label>
      <label
        >Keacakan tulisan
        <input type="range" id="rand" min="0" max="10" value="4"
      /></label>
      <label
        >Warna tinta <input type="color" id="color" value="#1a237e"
      /></label>
      <label
        >Efek scan/tekstur
        <input type="range" id="scan" min="0" max="10" value="3"
      /></label>
      <label
        >Lecek/kusut
        <input type="range" id="crumple" min="0" max="10" value="3"
      /></label>
      <button id="go">Buat Gambar</button>
      <button id="dl">Download PNG</button>
    </div>
    <canvas id="c"></canvas>

      const $ = (id) => document.getElementById(id);
      const cv = $("c"),
        out = cv.getContext("2d");
      const W = 1240;
      let H = 1800;
      const pg = document.createElement("canvas");
      const ctx = pg.getContext("2d");
      let paper = null,
        lines = [];

      function rng(seed) {
        return () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      }

      // ---------- deteksi garis kertas otomatis ----------
      function detectLines(img) {
        const c = document.createElement("canvas");
        c.width = img.width;
        c.height = img.height;
        const x = c.getContext("2d");
        x.drawImage(img, 0, 0);
        const d = x.getImageData(0, 0, c.width, c.height).data;
        const x0 = Math.floor(c.width * 0.2),
          x1 = Math.floor(c.width * 0.8),
          n = c.height;
        const prof = new Float64Array(n);
        for (let y = 0; y < n; y++) {
          let s = 0;
          for (let xx = x0; xx < x1; xx++) {
            const i = (y * c.width + xx) * 4;
            s += (d[i] + d[i + 1] + d[i + 2]) / 3;
          }
          prof[y] = s / (x1 - x0);
        }
        const hp = new Float64Array(n),
          w = 5;
        for (let y = 0; y < n; y++) {
          let s = 0,
            k = 0;
          for (let j = -w; j <= w; j++) {
            if (y + j >= 0 && y + j < n) {
              s += prof[y + j];
              k++;
            }
          }
          hp[y] = prof[y] - s / k;
        }
        let m = 0,
          m2 = 0,
          cnt = 0;
        for (let y = 20; y < n - 20; y++) {
          m += hp[y];
          m2 += hp[y] * hp[y];
          cnt++;
        }
        const sd = Math.sqrt(m2 / cnt - (m / cnt) ** 2),
          thr = -sd * 0.8;
        let ys = [];
        for (let y = 3; y < n - 3; y++)
          if (hp[y] < thr && hp[y] <= hp[y - 1] && hp[y] < hp[y + 1])
            ys.push(y);
        const gaps = ys
          .slice(1)
          .map((v, i) => v - ys[i])
          .sort((a, b) => a - b);
        const med = gaps[Math.floor(gaps.length / 2)] || 15;
        const merged = [];
        for (const y of ys) {
          if (merged.length && y - merged[merged.length - 1] < med * 0.6) {
            if (hp[y] < hp[merged[merged.length - 1]])
              merged[merged.length - 1] = y;
          } else merged.push(y);
        }
        return merged.map((y) => y * (W / img.width));
      }

      function loadPaper(src) {
        return new Promise((res) => {
          const img = new Image();
          img.onload = () => {
            paper = img;
            H = Math.round((W * img.height) / img.width);
            cv.width = W;
            cv.height = H;
            pg.width = W;
            pg.height = H;
            lines = detectLines(img);
            res();
          };
          img.src = src;
        });
      }

      // ---------- tulis ke kertas ----------
      function draw() {
        ctx.drawImage(paper, 0, 0, W, H);
        if (lines.length < 3) return;
        const diffs = lines
          .slice(1)
          .map((v, i) => v - lines[i])
          .sort((a, b) => a - b);
        const gap = diffs[Math.floor(diffs.length / 2)];
        const k = +$("rand").value / 10;
        const size = gap * 1.35 * (+$("size").value / 100);
        const font =
          $("font").value === "custom" ? "CustomHand" : $("font").value;
        const r = rng(12345);
        ctx.fillStyle = $("color").value;
        ctx.textBaseline = "alphabetic";
        ctx.font = `${size}px "${font}", cursive`;

        const left = W * (+$("left").value / 100),
          maxX = W * 0.95;
        let idx = +$("start").value,
          x = left;
        const baseY = () => lines[idx] - gap * 0.16;
        const newLine = () => {
          x = left;
          idx++;
        };

        for (const p of $("text").value.split("\n")) {
          for (const w of p.split(" ")) {
            const ww = ctx.measureText(w).width + w.length * k * 2;
            if (x + ww > maxX && x > left) newLine();
            if (idx >= lines.length) return;
            const lineWob = (r() - 0.5) * gap * 0.12 * k;
            for (const ch of w) {
              const cw = ctx.measureText(ch).width;
              const dy = (r() - 0.5) * gap * 0.18 * k + lineWob;
              const rot = (r() - 0.5) * 0.12 * k,
                sc = 1 + (r() - 0.5) * 0.12 * k;
              ctx.save();
              ctx.translate(x + cw / 2, baseY() + dy);
              ctx.rotate(rot);
              ctx.scale(sc, sc);
              ctx.fillText(ch, -cw / 2, 0);
              ctx.restore();
              x += cw + (r() - 0.3) * 3 * k;
            }
            x += ctx.measureText(" ").width * (0.9 + r() * 0.5 * k);
          }
          newLine();
          if (idx >= lines.length) return;
        }
      }

      // ---------- efek scan + lecek ----------
      function crumple() {
        const c = +$("crumple").value / 10;
        if (!c) return;
        const r = rng(999);
        for (let i = 0; i < 70 * c; i++) {
          const x = r() * W,
            y = r() * H,
            rad = 80 + r() * 260,
            dark = i % 2 === 0;
          const g = out.createRadialGradient(x, y, 0, x, y, rad);
          g.addColorStop(
            0,
            dark ? `rgba(0,0,0,${0.13 * c})` : `rgba(255,255,255,${0.16 * c})`,
          );
          g.addColorStop(1, "rgba(0,0,0,0)");
          out.fillStyle = g;
          out.fillRect(x - rad, y - rad, rad * 2, rad * 2);
        }
        const n = Math.round(8 + 22 * c);
        for (let i = 0; i < n; i++) {
          let x = r() * W,
            y = r() * H,
            a = r() * Math.PI * 2;
          const pts = [[x, y]],
            steps = 8 + Math.floor(r() * 14);
          for (let j = 0; j < steps; j++) {
            a += (r() - 0.5) * 0.7;
            x += Math.cos(a) * 45;
            y += Math.sin(a) * 45;
            pts.push([x, y]);
          }
          for (const [off, col, w] of [
            [0, `rgba(40,30,10,${0.22 * c})`, 3],
            [3, `rgba(255,255,255,${0.35 * c})`, 3],
            [-2, `rgba(0,0,0,${0.08 * c})`, 6],
          ]) {
            out.strokeStyle = col;
            out.lineWidth = w;
            out.lineJoin = "round";
            out.beginPath();
            pts.forEach(([px, py], q) =>
              q
                ? out.lineTo(px + off, py + off)
                : out.moveTo(px + off, py + off),
            );
            out.stroke();
          }
        }
      }
      function finish() {
        const s = +$("scan").value / 10;
        out.setTransform(1, 0, 0, 1, 0, 0);
        out.filter = "none";
        out.fillStyle = "#bdbdbd";
        out.fillRect(0, 0, W, H);
        if (s === 0) {
          out.drawImage(pg, 0, 0);
          crumple();
          return;
        }
        const r = rng(777);
        out.save();
        out.translate(W / 2, H / 2);
        out.rotate((r() - 0.5) * 0.012 * s * 2);
        out.scale(1.02, 1.02);
        out.filter = `blur(${0.5 * s}px) contrast(${1 - 0.08 * s}) sepia(${0.25 * s})`;
        out.drawImage(pg, -W / 2, -H / 2);
        out.restore();
        out.filter = "none";
        const g = out.createRadialGradient(
          W / 2,
          H / 2,
          H * 0.25,
          W / 2,
          H / 2,
          H * 0.75,
        );
        g.addColorStop(0, "rgba(0,0,0,0)");
        g.addColorStop(1, `rgba(60,40,10,${0.35 * s})`);
        out.fillStyle = g;
        out.fillRect(0, 0, W, H);
        crumple();
        const img = out.getImageData(0, 0, W, H),
          d = img.data,
          n = 22 * s;
        for (let i = 0; i < d.length; i += 4) {
          const v = (r() - 0.5) * n;
          d[i] += v;
          d[i + 1] += v;
          d[i + 2] += v * 0.9;
        }
        out.putImageData(img, 0, 0);
        out.globalAlpha = 0.1 * s;
        out.strokeStyle = "#8a7a5a";
        out.lineWidth = 1;
        for (let i = 0; i < 1400 * s; i++) {
          const x = r() * W,
            y = r() * H,
            a = r() * Math.PI,
            l = 4 + r() * 14;
          out.beginPath();
          out.moveTo(x, y);
          out.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
          out.stroke();
        }
        out.globalAlpha = 1;
      }
      function render() {
        if (!paper) return;
        $("startv").textContent = $("start").value;
        draw();
        finish();
      }

      $("fontfile").onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const face = new FontFace("CustomHand", await f.arrayBuffer());
        await face.load();
        document.fonts.add(face);
        $("font").value = "custom";
        render();
      };
      $("paperfile").onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        await loadPaper(URL.createObjectURL(f));
        render();
      };
      $("go").onclick = async () => {
        await document.fonts.ready;
        render();
      };
      $("dl").onclick = () => {
        const a = document.createElement("a");
        a.href = cv.toDataURL("image/png");
        a.download = "tulisan-tangan-folio.png";
        a.click();
      };
      [
        "font",
        "start",
        "size",
        "left",
        "rand",
        "color",
        "scan",
        "crumple",
      ].forEach((id) => ($(id).oninput = render));
      loadPaper(PAPER_DEFAULT)
        .then(() => document.fonts.ready)
        .then(render);
    </script>
