<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Tulisan Tangan Folio</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat&family=Homemade+Apple&family=Reenie+Beanie&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:12px;background:#eee;color:#222}
  .panel{max-width:700px;margin:auto;display:grid;gap:8px}
  textarea{width:100%;height:160px;box-sizing:border-box;padding:8px;font-size:15px}
  label{font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  input[type=range]{flex:1}
  button,select{padding:10px;font-size:15px}
  canvas{display:block;max-width:100%;height:auto;margin:12px auto;box-shadow:0 2px 8px #0004;background:#fff}
</style>
</head>
<body>
<div class="panel">
  <textarea id="text" placeholder="Ketik teks di sini...">Nama : Budi Santoso
NIM : 123456789

Pada hari ini saya mengerjakan tugas menulis tangan menggunakan generator buatan sendiri. Hasilnya dibuat agar mirip tulisan tangan asli dan mengikuti garis kertas folio.</textarea>
  <label>Font
    <select id="font">
      <option value="Caveat">Caveat</option>
      <option value="Homemade Apple">Homemade Apple</option>
      <option value="Reenie Beanie">Reenie Beanie</option>
      <option value="Nanum Pen Script">Nanum Pen Script</option>
      <option value="custom">Font sendiri (upload .ttf)</option>
    </select>
  </label>
  <label>Upload font tulisan tangan kamu <input type="file" id="fontfile" accept=".ttf,.otf,.woff,.woff2"></label>
  <label>Ukuran huruf <input type="range" id="size" min="24" max="56" value="40"></label>
  <label>Keacakan <input type="range" id="rand" min="0" max="10" value="4"></label>
  <label>Warna tinta <input type="color" id="color" value="#1a237e"></label>
  <label>Efek scan/tekstur <input type="range" id="scan" min="0" max="10" value="6"></label>
  <label>Lecek/kusut <input type="range" id="crumple" min="0" max="10" value="4"></label>
  <label>Jarak garis <input type="range" id="gap" min="40" max="70" value="52"></label>
  <button id="go">Buat Gambar</button>
  <button id="dl">Download PNG</button>
</div>
<canvas id="c" width="1240" height="1900"></canvas>

<script>
const $ = id => document.getElementById(id);
const cv = $('c'), out = cv.getContext('2d');
const W = cv.width, H = cv.height;
const pg = document.createElement('canvas'); pg.width = W; pg.height = H;
const ctx = pg.getContext('2d');
const MARGIN_X = 150, TOP = 170, RIGHT = 70, BOTTOM = 80;

// Random bisa diulang (seed), biar hasil konsisten
function rng(seed){ return () => (seed = (seed*16807) % 2147483647) / 2147483647; }

function drawPaper(gap){
  ctx.fillStyle = '#fffef8'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#9ec5e8'; ctx.lineWidth = 2;
  for(let y=TOP; y<H-BOTTOM; y+=gap){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.strokeStyle = '#e57373';           // garis margin merah
  ctx.beginPath(); ctx.moveTo(MARGIN_X-20,0); ctx.lineTo(MARGIN_X-20,H); ctx.stroke();
}

function draw(){
  const gap = +$('gap').value, size = +$('size').value, k = +$('rand').value/10;
  const font = $('font').value === 'custom' ? 'CustomHand' : $('font').value;
  const r = rng(12345);
  drawPaper(gap);
  ctx.fillStyle = $('color').value;
  ctx.textBaseline = 'alphabetic';
  ctx.font = `${size}px "${font}", cursive`;

  const maxX = W - RIGHT;
  let x = MARGIN_X, line = 0;
  const baseY = () => TOP + line*gap - 10;
  const newLine = () => { x = MARGIN_X; line++; };
  const tooLow = () => baseY() > H - BOTTOM;

  const paragraphs = $('text').value.split('\n');
  for(const p of paragraphs){
    const words = p.split(' ');
    for(const w of words){
      const ww = ctx.measureText(w).width + w.length*k*2;
      if(x + ww > maxX && x > MARGIN_X) newLine();
      if(tooLow()) return;
      // jitter per baris (tulisan naik-turun pelan) + per huruf
      const lineWob = (r()-0.5)*4*k;
      for(const ch of w){
        const cw = ctx.measureText(ch).width;
        const dy = (r()-0.5)*6*k + lineWob;
        const rot = (r()-0.5)*0.12*k;
        const sc = 1 + (r()-0.5)*0.12*k;
        ctx.save();
        ctx.translate(x + cw/2, baseY() + dy);
        ctx.rotate(rot); ctx.scale(sc, sc);
        ctx.fillText(ch, -cw/2, 0);
        ctx.restore();
        x += cw + (r()-0.3)*3*k;
      }
      x += ctx.measureText(' ').width * (0.9 + r()*0.5*k);
    }
    newLine();
    if(tooLow()) return;
  }
}

function crumple(){
  const c = +$('crumple').value/10; if(!c) return;
  const r = rng(999);
  // bercak terang-gelap besar: permukaan kertas tidak rata
  for(let i=0;i<70*c;i++){
    const x=r()*W, y=r()*H, rad=80+r()*260, dark=i%2===0;
    const g = out.createRadialGradient(x,y,0,x,y,rad);
    g.addColorStop(0, dark?`rgba(0,0,0,${0.13*c})`:`rgba(255,255,255,${0.16*c})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    out.fillStyle = g; out.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  // lipatan/kerutan: garis gelap + pasangan garis terang di sebelahnya
  const n = Math.round(8+22*c);
  for(let i=0;i<n;i++){
    let x=r()*W, y=r()*H, a=r()*Math.PI*2;
    const pts=[[x,y]], steps=8+Math.floor(r()*14);
    for(let j=0;j<steps;j++){
      a += (r()-0.5)*0.7; x += Math.cos(a)*45; y += Math.sin(a)*45; pts.push([x,y]);
    }
    for(const [off,col,w] of [[0,`rgba(40,30,10,${0.22*c})`,3],[3,`rgba(255,255,255,${0.35*c})`,3],[-2,`rgba(0,0,0,${0.08*c})`,6]]){
      out.strokeStyle=col; out.lineWidth=w; out.lineJoin='round'; out.beginPath();
      pts.forEach(([px,py],k)=> k?out.lineTo(px+off,py+off):out.moveTo(px+off,py+off));
      out.stroke();
    }
  }
}
function finish(){
  const s = +$('scan').value/10;
  out.setTransform(1,0,0,1,0,0); out.filter = 'none';
  out.fillStyle = '#bdbdbd'; out.fillRect(0,0,W,H);
  if(s === 0){ out.drawImage(pg,0,0); crumple(); return; }
  const r = rng(777);
  // sedikit miring + blur halus seperti hasil scan
  out.save();
  out.translate(W/2,H/2); out.rotate((r()-0.5)*0.012*s*2); out.scale(1.02,1.02);
  out.filter = `blur(${0.5*s}px) contrast(${1-0.08*s}) sepia(${0.25*s})`;
  out.drawImage(pg,-W/2,-H/2);
  out.restore(); out.filter = 'none';
  // pencahayaan tidak rata (gelap di pinggir, bayangan di salah satu sisi)
  const g = out.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(60,40,10,${0.35*s})`);
  out.fillStyle = g; out.fillRect(0,0,W,H);
  const lg = out.createLinearGradient(0,0,W,0);
  lg.addColorStop(0,`rgba(0,0,0,${0.18*s})`); lg.addColorStop(0.15,'rgba(0,0,0,0)');
  out.fillStyle = lg; out.fillRect(0,0,W,H);
  crumple();
  // tekstur kertas: noise halus + serat
  const img = out.getImageData(0,0,W,H), d = img.data, n = 22*s;
  for(let i=0;i<d.length;i+=4){
    const v = (r()-0.5)*n;
    d[i]+=v; d[i+1]+=v; d[i+2]+=v*0.9;
  }
  out.putImageData(img,0,0);
  out.globalAlpha = 0.10*s; out.strokeStyle = '#8a7a5a'; out.lineWidth = 1;
  for(let i=0;i<1400*s;i++){
    const x=r()*W, y=r()*H, a=r()*Math.PI, l=4+r()*14;
    out.beginPath(); out.moveTo(x,y); out.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); out.stroke();
  }
  out.globalAlpha = 1;
}
function render(){ draw(); finish(); }

$('fontfile').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  const face = new FontFace('CustomHand', await f.arrayBuffer());
  await face.load(); document.fonts.add(face);
  $('font').value = 'custom'; render();
};
$('go').onclick = async () => { await document.fonts.ready; render(); };
$('dl').onclick = () => {
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png'); a.download = 'tulisan-tangan-folio.png'; a.click();
};
['font','size','rand','color','gap','scan','crumple'].forEach(id => $(id).oninput = render);
document.fonts.ready.then(render);
</script>
</body>
</html>
